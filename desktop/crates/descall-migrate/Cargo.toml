[package]
name = "descall-migrate"
description = "Electron -> Tauri migration core: handoff format, migration job and state machine, crash-safe runner, legacy cleanup, Electron safeStorage (OSCrypt v10) fallback, DPAPI and owner-only files on Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
aes-gcm = "0.11"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }

[dev-dependencies]
tempfile = "3"
