[package]
name = "descall-setup"
description = "Descall-Setup.exe: per-user installer, updater and Electron-to-Tauri migration window for the Descall desktop app (draft B UI)."
# Shown in the setup window, its log and its User-Agent: the app version it installs.
version = "4.1.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "DescallSetup"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
minisign-verify = "0.3"
zip = { version = "9.7", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false }
webview2-com = "0.39"
windows-core = "0.62"
windows-registry = "0.6"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinHttp",
  "Win32_Networking_WinSock",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
