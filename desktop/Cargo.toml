[workspace]
resolver = "2"
members = [
  "crates/descall-capture",
  "crates/descall-migrate",
  "crates/descall-migrator",
  "app/src-tauri",

]
default-members = ["crates/descall-capture", "crates/descall-migrate", "crates/descall-migrator"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
windows = { version = "0.62.2" }
windows-core = { version = "0.62.2" }
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
