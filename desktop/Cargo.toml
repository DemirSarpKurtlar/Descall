# Descall desktop on Rust / Tauri 2 (Windows x64). Separate from the npm / vite / Electron
# pipelines: nothing under frontend/ depends on this folder. The Tauri app loads the regular
# frontend/dist build (ELECTRON_BUILD=1, relative base) unchanged.
#
#   cargo test                                   platform-independent crates, any host
#   cargo check --workspace --target x86_64-pc-windows-gnu
#   (CI) .github/workflows/tauri-build.yml       windows-latest build of app + setup
[workspace]
resolver = "2"
members = [
  "crates/descall-capture",
  "crates/descall-migrate",
  "crates/descall-migrator",
  "crates/descall-setup",
  "crates/descall-shell",
  "tools/descall-capture-bench",
  "premium-logic",
  "app/src-tauri",
]
default-members = ["crates/descall-capture", "crates/descall-migrate", "crates/descall-migrator", "crates/descall-setup", "crates/descall-shell", "tools/descall-capture-bench", "premium-logic"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
windows = { version = "0.62.2" }
windows-core = { version = "0.62.2" }
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
descall-capture = { path = "crates/descall-capture" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The Descall+ PIN hash (scrypt) took over a minute per `cargo test` run unoptimised (three
# hashes in the premium-logic tests, on both CI jobs) and seconds per PIN check in dev builds.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3

# The migrator and the setup bootstrapper are small one-shot tools: optimise them for size.
[profile.release.package.descall-migrator]
opt-level = "s"

[profile.release.package.descall-setup]
opt-level = "s"
