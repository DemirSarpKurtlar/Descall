# Minimal workspace created by the migration work (descall-migrate + descall-migrator).
# The coordinator merges this with the Tauri app / installer / capture workspace.
[workspace]
resolver = "2"
members = [
  "crates/descall-migrate",
  "crates/descall-migrator",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
windows = { version = "0.62.2" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
