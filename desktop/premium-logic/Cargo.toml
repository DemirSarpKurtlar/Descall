# Linux test harness for the platform-independent Descall+ logic. It compiles the very files
# under app/src-tauri/src/premium/logic/ (no copy), without Tauri or WebView2, so `cargo test`
# in desktop/ (a default member) runs those tests on any host.
[package]
name = "descall-premium-logic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
getrandom = "0.3"
scrypt = { version = "0.11", default-features = false }
# store.rs saves through descall_shell::durable (temp file + retried rename), same as the app.
descall-shell = { path = "../crates/descall-shell" }
