# Linux test harness for the platform-independent Descall+ logic. It compiles the very files
# under app/src-tauri/src/premium/logic/ (no copy), without Tauri or WebView2:
#   cargo test --manifest-path desktop/premium-logic/Cargo.toml
[package]
name = "descall-premium-logic"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
scrypt = { version = "0.11", default-features = false }

# Standalone until the coordinator adds it to the desktop workspace.
[workspace]
