    <script>

      (function () {

          var isPublicDimaLanding = path === "/dimaai" || path === "/tr/dimaai";
          var isApp = false;
          for (var i = 0; i < appPrefixes.length; i++) {
            var p = appPrefixes[i];
            if (isPublicDimaLanding && p === "/dimaai") continue;
            if (path === p || path.indexOf(p + "/") === 0) {
              isApp = true;
              break;
            }
          }
          var hasToken = false;
          try {
            hasToken = !!localStorage.getItem("descall_token");

          if (!isApp && !hasToken) return;

    <script>
      /* Boot splash only — prerender strips this with #boot-splash. */
      (function () {
        var el = document.getElementById("boot-splash");
        if (el) el.setAttribute("data-shown-at", String(Date.now()));
        window.__descallDismissBootSplash = function (opts) {
          var root = document.getElementById("boot-splash");
          if (!root || root.classList.contains("boot-splash--hide")) return;
          var minMs = (opts && typeof opts.minMs === "number") ? opts.minMs : 450;
          var maxMs = (opts && typeof opts.maxMs === "number") ? opts.maxMs : 1800;
          var shownAt = Number(root.getAttribute("data-shown-at") || Date.now());
          var elapsed = Date.now() - shownAt;
          var wait = Math.max(0, minMs - elapsed);
          if (maxMs >= 0) wait = Math.min(wait, Math.max(0, maxMs - elapsed));
          // If we already exceeded maxMs, dismiss on next tick (no more waiting).
          if (maxMs >= 0 && elapsed >= maxMs) wait = 0;
          var status = document.getElementById("boot-status");
          if (status) status.textContent = "Ready";
          window.setTimeout(function () {
            root.classList.add("boot-splash--hide");
            window.setTimeout(function () {
              if (root && root.parentNode) root.parentNode.removeChild(root);
            }, 320);
          }, wait);
        };
        // Hard cap from HTML parse — do NOT wait for the JS bundle / React.
        // Bundle download was keeping STARTING visible for 10–13s on hard nav.
        window.setTimeout(function () {
          try { window.__descallDismissBootSplash({ minMs: 0, maxMs: 0 }); } catch (e) {}
        }, 1800);
        // Prerendered marketing HTML: keep #seo-static visible and skip the splash
        // overlay — but NEVER strip it for authenticated/app-shell boots. Hard nav to
        // /calls|/direct with a token used to remove the splash while seo children still
        // existed (hidden), leaving a multi-second empty black #root.
        var seo = document.getElementById("seo-static");
        var appShell = document.documentElement.getAttribute("data-app-shell") === "1";
        if (seo && seo.childElementCount > 0 && !appShell) {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }
      })();
    </script>
    <script>

      (function () {

            if (consentBtn) {
              ev.preventDefault();
              var choice = consentBtn.getAttribute("data-consent");
              try {
                localStorage.setItem(
                  "descall:cookie_consent_v1",
                  JSON.stringify({ choice: choice, at: new Date().toISOString() })
                );
              } catch (e0) {}
              if (choice === "accepted") {
                try {
                  sessionStorage.setItem("descall:analytics_allowed", "1");
                  window.__descallAnalyticsAllowed = true;

                } catch (e1) {}
              }
              document.documentElement.setAttribute("data-has-consent", "1");
              var box = document.getElementById("mkt-consent-static");
              if (box) {
                box.hidden = true;
                box.style.display = "none";
              }
              try {
                var payload = JSON.stringify({
                  choice: choice,
                  path: location.pathname,
                  at: new Date().toISOString(),
                  surface: "static_banner",
                });
                var api =
                  (window.__DESCALL_API_URL__ || window.location.origin || "").replace(/\/$/, "") +
                  "/api/marketing/consent-event";

            var btn = ev.target && ev.target.closest && ev.target.closest("[data-hydrate]");
            if (!btn) return;
            var auth = "";

              auth = btn.getAttribute("data-auth") || "";
              if (auth) sessionStorage.setItem("descall:open_auth", auth);
            } catch (e) {}
            try {
              window.dispatchEvent(new CustomEvent("descall:open-auth", { detail: { auth: auth } }));
            } catch (eOpen) {}

            var isLink = btn.tagName === "A" && btn.getAttribute("href");

            if (!isLink || shellReady) ev.preventDefault();

              window.dispatchEvent(new CustomEvent("descall:prefetch-hydrate"));

        document.addEventListener(
          "pointerenter",
          function (ev) {
            var btn = ev.target && ev.target.closest && ev.target.closest("[data-hydrate]");
            if (!btn) return;
            try {
              window.dispatchEvent(new CustomEvent("descall:prefetch-hydrate"));
            } catch (e4) {}
          },
          true
        );
      })();
    </script>
