    <script>
      /* Paint the equipped theme before the bundle. A late data-theme write
         flashes the default dark window, rail, and accent. Catalog themes
         own --primary; only dark/light keep a stored accent. */
      (function () {
        try {
          var raw = localStorage.getItem("descall_user_settings") || localStorage.getItem("descall_settings") || "{}";
          var settings = JSON.parse(raw);
          var theme = settings.premiumThemeKey || (settings.darkMode === false ? "light" : "dark");
          if (theme) document.documentElement.setAttribute("data-theme", theme);
          var accent = settings.accentColor;
          if (accent && !settings.premiumThemeKey && /^#[0-9A-Fa-f]{6}$/.test(String(accent))) {
            var root = document.documentElement.style;
            root.setProperty("--primary", accent);
            root.setProperty("--primary-2", accent);
            root.setProperty("--accent", accent);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      /* Mobile boot surface (native Capacitor app + phone/touch web, same rule as
         hooks/useMobile.js; never Electron): the boot splash is the launch-screen
         look (Descall logo on #393C4D, no text) and React's boot placeholder keeps
         it up instead of painting a skeleton. Desktop web / Electron unchanged. */
      (function () {
        window.__descallBootHolds = 0;
        window.__descallHoldBootSplash = function () {
          window.__descallBootHolds += 1;
          var released = false;
          return function () {
            if (released) return;
            released = true;
            window.__descallBootHolds = Math.max(0, window.__descallBootHolds - 1);
            window.setTimeout(function () {
              if (window.__descallBootHolds === 0 && window.__descallDismissBootSplash) {
                window.__descallDismissBootSplash({ minMs: 0, maxMs: 0 });
              }
            }, 0);
          };
        };
        try {
          var w = window;
          var ua = navigator.userAgent || "";
          if ((w.electronAPI && w.electronAPI.isElectron) || /Electron/i.test(ua)) return;
          var cap = w.Capacitor;
          var nativeApp = !!(cap && typeof cap.isNativePlatform === "function" && cap.isNativePlatform());
          var mobileUa = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile|tablet/i.test(ua);
          if (nativeApp || mobileUa || (w.innerWidth || 0) <= 768) {
            document.documentElement.classList.add("boot-mobile");
          }
          /* Phone web only: the canvas has to be the aurora before CSS loads,
             or Safari/Chrome paint #0b0c10 under the tab bar and behind their toolbars.
             innerWidth is often 0 while the head parses on iOS, a phone UA still counts. */
          var width = w.innerWidth || 0;
          if (!nativeApp && width < 960 && (mobileUa || (width > 0 && width <= 768))) {
            document.documentElement.classList.add("boot-phone-web");
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* Critical first paint, marketing must stay scrollable; only the authenticated
         app shell locks html/body (data-app-shell). Locking overflow by default after
         data-react-ready broke every hydrated marketing page (esp. /download). */
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0b0c10;
        overflow-x: hidden;
        overflow-y: auto;
      }
      /* Phone web canvas: same aurora as the app, tall enough to run under
         the floating tab bar and behind the browser toolbar. */
      html.boot-phone-web,
      html.boot-phone-web body {
        background-color: #101118;
        background-image: linear-gradient(170deg, #151724 0%, #17181f 45%, #101118 100%);
        background-repeat: no-repeat;
        background-position: center top;
        background-size: 100% 100lvh;
        min-height: 100%;
        min-height: -webkit-fill-available;
        min-height: 100dvh;
        min-height: 100lvh;
      }
      html[data-app-shell="1"],
      html[data-app-shell="1"] body,
      html[data-app-shell="1"] #root {
        /* 100% collapses to 0 on iOS Safari after the fixed splash is removed,
           and overflow:hidden then clips the app, a solid black screen. */
        height: 100dvh;
        min-height: 100dvh;
        overflow: hidden;
      }
      /* Phone web, after the shell lock: Safari's floating toolbar samples
         html/body background-color. A 100dvh overflow:hidden canvas clips that
         region to black. The document is the scroll container (100lvh, overflow
         auto) and the solid color is the aurora bottom, not #000 / #0b0c10. */
      html.boot-phone-web[data-app-shell="1"],
      html.boot-phone-web[data-app-shell="1"] body {
        height: auto;
        min-height: 100lvh;
        max-height: none;
        overflow-x: hidden;
        overflow-y: auto;
        background-color: #101118;
        background-image: linear-gradient(170deg, #151724 0%, #17181f 45%, #101118 100%);
        background-repeat: no-repeat;
        background-position: center top;
        background-size: 100% 100lvh;
      }
      html.boot-phone-web[data-app-shell="1"] body {
        box-sizing: border-box;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html.boot-phone-web[data-app-shell="1"] #root {
        height: auto;
        min-height: 100lvh;
        max-height: none;
        overflow: visible;
        background-color: transparent;
        background-image: none;
      }
      /* Electron: 100dvh plus the title-bar pad clips the bottom of every window.
         Web keeps the dvh rule above. */

      html.electron-app[data-app-shell="1"] body,
      html.electron-app[data-app-shell="1"] #root {
        height: 100%;
        min-height: 0;
