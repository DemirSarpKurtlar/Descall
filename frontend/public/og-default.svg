<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Descall — Discord alternative">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="55%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#1a1f35"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#5865f2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="markClip">
      <rect x="72" y="72" width="72" height="72" rx="18"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="980" cy="520" r="220" fill="#23a55a" opacity="0.12"/>

  <!-- Clean brand mark; clipped so Instagram never shows a dark smudge beside the wordmark -->
  <g clip-path="url(#markClip)">
    <rect x="72" y="72" width="72" height="72" rx="18" fill="#5865F2"/>
    <rect x="88" y="95" width="40" height="7" rx="3.5" fill="#f2f3f5"/>
    <rect x="88" y="111" width="40" height="7" rx="3.5" fill="#f2f3f5"/>
    <path d="M94 118 L90 128 L102 118 Z" fill="#f2f3f5"/>
  </g>

  <text x="168" y="120" fill="#f2f3f5" font-family="Inter, Avenir Next, Segoe UI, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.02em" dominant-baseline="middle">Descall</text>
  <text x="72" y="260" fill="#f2f3f5" font-family="Inter, Avenir Next, Segoe UI, sans-serif" font-size="64" font-weight="700" letter-spacing="-0.03em">A lighter Discord</text>
  <text x="72" y="336" fill="#f2f3f5" font-family="Inter, Avenir Next, Segoe UI, sans-serif" font-size="64" font-weight="700" letter-spacing="-0.03em">alternative.</text>
  <text x="72" y="410" fill="#949ba4" font-family="Inter, Segoe UI, sans-serif" font-size="28">Chat &#183; Voice &#183; Screen share &#183; Valorant LFG</text>
  <rect x="72" y="460" width="280" height="56" rx="14" fill="#7b89ff"/>
  <text x="212" y="496" fill="#0b0c10" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">descall.com</text>
</svg>
