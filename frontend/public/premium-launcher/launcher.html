<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'self'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descall</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<div class="stage">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ql-title">
    <h1 id="ql-title" class="sr-only"></h1>
    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list">
    </div>
    <ul id="results" class="results" role="listbox"></ul>
    <div id="state" class="state" aria-live="polite"></div>
    <div id="hint" class="hint"></div>
  </div>
</div>
<script src="launcher.js"></script>
</body>
</html>
