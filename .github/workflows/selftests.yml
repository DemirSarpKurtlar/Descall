# Fast node selftests. Publish and TestFlight call this workflow and wait
# for it, so a red conv-rows check cannot ship a desktop or iOS build.
name: Selftests

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run release selftests
        run: |
          set -euo pipefail
          node src/lib/callHistoryCache.selftest.mjs
          node electron/peArch.selftest.mjs
          node electron/updateRecover.selftest.mjs
          node electron/main.trayUpdater.selftest.mjs
          node electron/splash.selftest.mjs
          node electron/notificationCard.selftest.mjs
          node src/api/transportRetry.selftest.mjs
          node src/api/adminHttpRetry.selftest.mjs
          node src/styles/rail-icons.selftest.mjs
          node src/components/admin/adminOverviewUi.selftest.mjs
          node src/lib/glassConfirm.selftest.mjs
          node src/styles/conv-rows.selftest.mjs
          node src/styles/list-card-padding.selftest.mjs
          node src/styles/call-glass.selftest.mjs
          node src/lib/profileModalState.selftest.mjs
          node src/lib/shopChipScroll.selftest.mjs
          node src/site/siteIcons.selftest.mjs
          node src/styles/feedback-nudge.selftest.mjs
          node src/styles/glass-desktop/glass-desktop-scope.selftest.mjs
          node src/styles/glass-desktop/themeTint.selftest.mjs
          node src/styles/glass/glass-scope.selftest.mjs
          node src/lib/themeDocument.selftest.mjs
          node src/lib/casinoCommands.selftest.mjs
          node backend/socket/casinoIosGate.selftest.cjs
          node backend/games/BlackjackGame.selftest.js
          node backend/games/SlotGame.selftest.js
          node backend/games/CoinFlipGame.selftest.js
          node backend/lib/corsOrigins.selftest.cjs
          node backend/lib/messageRequestPolicy.selftest.cjs
          node backend/lib/messageRequestStore.selftest.cjs
          node backend/socket/messageRequests.selftest.cjs
          node backend/socket/groupCallMembership.selftest.cjs
