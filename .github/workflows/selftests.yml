# Fast node selftests. Publish and TestFlight call this workflow and wait
# for it, so a red conv-rows check cannot ship a desktop or iOS build.
name: Selftests

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every node test file under frontend/ (discovered by name, run in parallel by
  # scripts/run-tests.mjs). Quarantined files are listed with a reason in
  # frontend/tests.quarantine.json and cannot fail the job.
  all-tests:
    name: All tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/backend/package-lock.json
      - name: Install frontend deps (lockfile)
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Install backend deps (lockfile)
        working-directory: frontend/backend
        run: npm ci --no-audit --no-fund
      - name: Run all tests (shard ${{ matrix.shard }})
        run: node scripts/run-tests.mjs --shard=${{ matrix.shard }}

  # Master Update A2: messaging on iPhone / iPad / desktop viewports (double-tap heart,
  # optimistic reactions + rollback toast, menu closes on pick, jump to bottom). Real
  # built app against an in-process mock API + Socket.IO on 127.0.0.1; the browser
  # aborts every other URL, so nothing reaches production.
  messaging-e2e:
    name: Messaging e2e (iPhone/iPad/desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/backend/package-lock.json
      - name: Install frontend deps (lockfile)
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Install backend deps (lockfile, for socket.io)
        working-directory: frontend/backend
        run: npm ci --no-audit --no-fund
      - name: Install playwright-core (driver only, system Chrome)
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.64.1
      - name: Build against the local mock
        env:
          VITE_API_BASE_URL: http://127.0.0.1:5361
          VITE_SOCKET_URL: http://127.0.0.1:5361
        run: npx vite build --outDir dist-e2e
      - name: Messaging e2e
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core
          CHROME_PATH: /usr/bin/google-chrome
          DESCALL_E2E_SHOTS: ${{ runner.temp }}/e2e-msg-shots
        run: node e2e/messaging.e2e.cjs
      - name: Kayıt İstatistikleri retry e2e (iPhone)
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core
          CHROME_PATH: /usr/bin/google-chrome
          DESCALL_E2E_SHOTS: ${{ runner.temp }}/e2e-msg-shots/signup-stats
        run: node e2e/signupStatsRetry.e2e.cjs --dist=dist-e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-messaging-shots
          path: ${{ runner.temp }}/e2e-msg-shots
          if-no-files-found: ignore

