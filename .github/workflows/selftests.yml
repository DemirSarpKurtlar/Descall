  # Promo codes: the redemption logic lives in Postgres functions, so run the migration
  # and the atomic/race tests against a throwaway Postgres (never Supabase).
  promo-postgres:
    name: Promo codes (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: promo
          POSTGRES_PASSWORD: promo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U promo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROMO_TEST_PG_URL: postgresql://promo:promo@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: frontend/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Promo migration + redemption tests
        run: |
          set -euo pipefail
          node test/promo.db.test.cjs
          node test/promo.race.test.cjs
          node test/promo.integration.test.cjs
          node test/promo.unit.test.cjs
          node test/promoUserSearch.test.cjs
          node test/promoAvailable.db.test.cjs
          node test/promoAvailable.integration.test.cjs

  # Special badges: grant / take-back / equip / #001 rules live in Postgres functions, so run
  # the migration (on top of the promo migration) and its tests against a throwaway Postgres.
  special-badges-postgres:
    name: Special badges (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sbadge
          POSTGRES_PASSWORD: sbadge
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sbadge" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPECIAL_BADGES_TEST_PG_URL: postgresql://sbadge:sbadge@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: frontend/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Special badge migration + rules tests
        run: |
          set -euo pipefail
          node test/specialBadges.db.test.cjs | tee /tmp/sb.log
          grep -q "specialBadges.db.test.cjs: ok" /tmp/sb.log
          node test/specialBadges.integration.test.cjs
          node test/adminAudit.db.test.cjs | tee /tmp/aa.log
          grep -q "adminAudit.db.test.cjs: ok" /tmp/aa.log

  # 2.11.11: boot the real Electron app from a production build whose HTML has CRLF line
  # endings (what the Windows runner used to check out) and require the main window to
  # paint with the splash gone and no inline script blocked by the CSP. The Windows
  # release job runs the same smoke on the packaged Descall.exe.
  electron-boot-smoke:
    name: Electron boot smoke (CRLF build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps (with the Electron binary)
        run: npm ci --no-audit --no-fund
      - name: Electron production build
        env:
          ELECTRON_BUILD: "1"
        run: npm run build
      - name: Give the built HTML Windows (CRLF) line endings
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
            let n = 0;
            for (const f of walk("dist").filter((f) => f.endsWith(".html"))) {
              fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace(/\r\n?/g, "\n").replace(/\n/g, "\r\n")); n++;
            }
            console.log("CRLF html files:", n);'
      - name: Boot smoke
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          xvfb-run -a -s "-screen 0 1400x900x24" npx electron . --no-sandbox --descall-smoke-boot --user-data-dir="$RUNNER_TEMP/descall-smoke" 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q "\[smoke-boot\] OK" "$RUNNER_TEMP/smoke.log"
      # 2.13.1: signed in against a mock API, open Mağaza → Ülkeler (245 flags), stay past the
      # paint watchdog's reload point, contain a forced tab render error, then reload on
      # /settings/shop and require every asset and both splash logos to load.
      - name: Electron Ülkeler tab e2e
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" npx electron electron/e2e/countriesTab.e2e.cjs --no-sandbox 2>&1 | tee "$RUNNER_TEMP/e2e-countries.log"
          grep -q "\[e2e-countries\] OK" "$RUNNER_TEMP/e2e-countries.log"
      # Store purchase modal: every category opens (portalled, centred, in the window),
      # the insufficient state links to the daily reward, buy → success → Geri al re-wears
      # the previous item without undoing the purchase, and it fits the minimum window.
      - name: Electron store purchase modal e2e
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" npx electron electron/e2e/storePurchaseModal.e2e.cjs --no-sandbox 2>&1 | tee "$RUNNER_TEMP/e2e-purchase.log"
          grep -q "\[e2e-purchase\] OK" "$RUNNER_TEMP/e2e-purchase.log"
      # Image viewer + composer menus (1024x688 … 1920x1080 and 800x600 / 640x480): the
      # viewer's top bar sits under the custom title bar, the image fits between the top
      # bar and the zoom pill, and no chat avatar status dot paints over the + / emoji menus.
      - name: Electron image viewer and composer menus e2e
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24" npx electron electron/e2e/mediaViewerMenus.e2e.cjs --no-sandbox 2>&1 | tee "$RUNNER_TEMP/e2e-media.log"
          grep -q "\[e2e-media\] OK" "$RUNNER_TEMP/e2e-media.log"
      # 3.0.0 notification capsule (mockup 33): real notification windows at the top centre,
      # blur → sharp entrance settles, Mesaj opens the chat, × and swipe-up dismiss without
      # opening, grouped update in place, call Kabul et reaches main, auto-dismiss.
      - name: Electron notification capsule e2e
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" npx electron electron/e2e/notificationCapsule.e2e.cjs --no-sandbox 2>&1 | tee "$RUNNER_TEMP/e2e-capsule.log"
          grep -q "\[e2e-capsule\] OK" "$RUNNER_TEMP/e2e-capsule.log"
