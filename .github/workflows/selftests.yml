# Fast node selftests. Publish and TestFlight call this workflow and wait
# for it, so a red conv-rows check cannot ship a desktop or iOS build.
name: Selftests

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run release selftests
        run: |
          set -euo pipefail
          node src/lib/callHistoryCache.selftest.mjs
          node electron/peArch.selftest.mjs
          node electron/updateRecover.selftest.mjs
          node electron/main.trayUpdater.selftest.mjs
          node electron/launchVisibility.selftest.mjs
          node electron/splash.selftest.mjs
          node electron/notificationCard.selftest.mjs
          node src/api/transportRetry.selftest.mjs
          node src/api/adminHttpRetry.selftest.mjs
          node src/styles/rail-icons.selftest.mjs
          node src/components/admin/adminOverviewUi.selftest.mjs
          node src/lib/glassConfirm.source.selftest.mjs
          node src/styles/conv-rows.selftest.mjs
          node src/lib/glassDesktop.selftest.mjs
          node src/lib/glassBreakpoints.selftest.mjs
          node src/styles/cosmeticPrecedence.selftest.mjs
          node src/lib/hookDepsTdz.selftest.mjs
          node src/styles/list-card-padding.selftest.mjs
          node src/styles/call-glass.selftest.mjs
          node src/lib/profileModalState.selftest.mjs
          node src/lib/shopChipScroll.selftest.mjs
          node src/site/siteIcons.selftest.mjs
          node src/styles/feedback-nudge.selftest.mjs
          node src/styles/glass-desktop/headerBand.selftest.mjs
          node src/styles/glass-desktop/messageHover.selftest.mjs
          node src/styles/glass-desktop/giphyCenter.selftest.mjs
          node src/styles/glass-desktop/callStage.selftest.mjs
          node src/lib/iosCallAudio.selftest.mjs
          node src/lib/callAudioDevices.selftest.mjs
          node src/lib/remoteAudioKeeper.selftest.mjs
          node src/lib/callDeviceMenus.selftest.mjs
          node src/lib/userVoicePanel.selftest.mjs
          node src/lib/updateTiming.selftest.mjs
          node electron/updateDeferral.selftest.mjs
          node src/lib/callRouteSync.selftest.mjs
          node src/lib/miniCallDock.selftest.mjs
          node src/components/call/callAudioWiring.selftest.mjs
          node src/styles/frost.selftest.mjs
          node src/styles/headerTitle.selftest.mjs
          node src/styles/glass-desktop/glass-desktop-scope.selftest.mjs
          node src/styles/glass-desktop/themeTint.selftest.mjs
          node src/styles/glass/glass-scope.selftest.mjs
          node src/lib/themeDocument.selftest.mjs
          node src/lib/casinoCommands.selftest.mjs
          node backend/socket/casinoIosGate.selftest.cjs
          node backend/lib/casinoRoomAccess.selftest.cjs
          node backend/socket/casinoChatTarget.selftest.cjs
          node backend/socket/roomJoinRemoved.selftest.cjs
          node backend/lib/dmSlashCommands.selftest.cjs
          node src/lib/slashCommands.selftest.mjs
          node src/lib/coinTossMotion.selftest.mjs
          node backend/games/BlackjackGame.selftest.js
          node backend/games/SlotGame.selftest.js
          node backend/games/CoinFlipGame.selftest.js
          node backend/lib/corsOrigins.selftest.cjs
          node backend/lib/groupAvatar.selftest.cjs
          node backend/lib/groupRename.selftest.cjs
          node backend/test/groupRename.integration.test.cjs
          node backend/lib/messageRequestPolicy.selftest.cjs
          node backend/lib/messageRequestStore.selftest.cjs
          node backend/socket/messageRequests.selftest.cjs
          node backend/socket/groupCallMembership.selftest.cjs
          node backend/lib/callRingFanout.selftest.cjs
          node backend/lib/turnCredentials.selftest.cjs
          node src/lib/callConnectionMachine.selftest.mjs
          node src/lib/callTileState.selftest.mjs
          node src/lib/speakingDetection.selftest.mjs
          node src/lib/webCallRingSync.selftest.mjs
          node src/lib/iosCallKitEndedElsewhere.selftest.mjs
          node electron/notificationCallCard.selftest.mjs
          node src/lib/voiceActivity.selftest.mjs
          node src/lib/voiceProfile.selftest.mjs
          node src/components/voice/speakingIndicator.selftest.mjs
          node src/lib/callGridReturn.selftest.mjs
          node src/lib/videoPresence.selftest.mjs
          node src/lib/bootSession.selftest.mjs
          node src/lib/iosNativeCall.selftest.mjs
          node src/lib/pinnedPopover.selftest.mjs
          node src/lib/appVersion.selftest.mjs
          node src/lib/singleActiveHover.selftest.mjs
          node src/lib/groupPhoto.selftest.mjs
          node src/lib/sidebarWidth.selftest.mjs
          node src/lib/swipeReveal.selftest.mjs
          node src/lib/dmPrefsCache.selftest.mjs
          node src/lib/groupInfo.selftest.mjs
          node src/lib/groupRename.selftest.mjs
          node src/components/layout/ContextMenu.parity.selftest.mjs
      - name: Install frontend dependencies (render selftests)
        run: npm ci --no-audit --no-fund
      - name: Server voice channel render selftest
        run: node src/components/servers/ServerVoicePanel.render.selftest.mjs
      - name: Native iOS call logic selftest (Swift, Foundation only)
        run: |
          set -euo pipefail
          if ! command -v swiftc >/dev/null 2>&1; then
            echo "::warning::swiftc not on this runner; the iOS Build check runs this test on macOS."
            exit 0
          fi
          swiftc -o "$RUNNER_TEMP/ncl" ios/App/App/DescallNativeCallLogic.swift ios/selftest/main.swift
          "$RUNNER_TEMP/ncl"
