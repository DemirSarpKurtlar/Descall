# Scale plan S2 (2.11.6): deploys the realtime Hub (Worker + one SQLite Durable Object) to
# rt.descall.com. Manual only. Workers Free plan: no paid product is enabled; if the daily
# free quota runs out the Worker errors and every client falls back to Render by itself.
#
# Secrets: CLOUDFLARE_API_TOKEN (account: Workers Scripts Edit; zone descall.com:
#          Workers Routes Edit + DNS Edit for the custom domain), CLOUDFLARE_ACCOUNT_ID,
#          EDGE_BRIDGE_SECRET (same value as the Render env var of that name).
# Nothing is printed: wrangler reads the bridge secret from stdin.
name: Cloudflare realtime

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test | dry-run | deploy"
        required: true
        default: dry-run
        type: choice
        options: [test, dry-run, deploy]

permissions:
  contents: read

concurrency:
  group: cloudflare-realtime
  cancel-in-progress: false

defaults:
  run:
    working-directory: workers/realtime

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Unit tests
        run: npm test
      - name: Bundle (dry run)
        if: inputs.mode != 'test'
        run: npx -y wrangler@4 deploy --dry-run --outdir /tmp/hub-build
      - name: Deploy
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGE_BRIDGE_SECRET: ${{ secrets.EDGE_BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          test -n "$EDGE_BRIDGE_SECRET" || { echo "EDGE_BRIDGE_SECRET repo secret missing"; exit 1; }
          npx -y wrangler@4 deploy
          printf '%s' "$EDGE_BRIDGE_SECRET" | npx -y wrangler@4 secret put EDGE_BRIDGE_SECRET
      - name: Health
        if: inputs.mode == 'deploy'
        run: |
          sleep 10
          curl -fsS https://rt.descall.com/health
