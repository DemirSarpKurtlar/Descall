name: Marketing quality gates

# Fails the PR/push when SEO shells, first-paint JS budget, or axe a11y smoke regress.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/marketing-quality.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/marketing-quality.yml"
  workflow_dispatch:

jobs:
  marketing-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --include=dev

      - name: Security policy and CORS selftests
        run: |
          node src/site/securityPolicy.selftest.mjs
          node backend/lib/corsOrigins.selftest.cjs

      - name: Production build + SEO validate + perf budget
        run: npm run build:prod

      - name: Client bundle secret scan
        run: node backend/lib/clientSecrets.selftest.cjs

      - name: Install Chrome + matching ChromeDriver
        run: |
          npx --yes browser-driver-manager install chrome@stable | tee /tmp/bdm-out.txt
          # Export paths printed by browser-driver-manager for later steps
          eval "$(grep -E '^(CHROME_TEST_PATH|CHROMEDRIVER_TEST_PATH)=' /tmp/bdm-out.txt | sed 's/TEST_PATH=/PATH=/')"
          echo "CHROME_PATH=${CHROME_PATH:-}" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=${CHROMEDRIVER_PATH:-}" >> "$GITHUB_ENV"
          # Fallback parse if env names differ
          if [ -z "${CHROME_PATH:-}" ]; then
            CHROME_PATH=$(sed -n 's/.*CHROME_TEST_PATH="\([^"]*\)".*/\1/p' /tmp/bdm-out.txt | head -1)
            CHROMEDRIVER_PATH=$(sed -n 's/.*CHROMEDRIVER_TEST_PATH="\([^"]*\)".*/\1/p' /tmp/bdm-out.txt | head -1)
            echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
            echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_PATH" >> "$GITHUB_ENV"
          fi

      - name: Serve dist + axe smoke
        run: |
          npx --yes serve -l 4173 dist >/tmp/serve-quality.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/features >/dev/null && break
            sleep 1
          done
          # load-delay: .mkt-section fades in (mkt-rise 0.8s) and restarts on hydration;
          # auditing mid-fade reported random color-contrast hits (18 vs 30 on the same build).
          AXE_ARGS="--exit --tags wcag2a,wcag2aa --load-delay 2500"
          if [ -n "${CHROMEDRIVER_PATH:-}" ]; then
            AXE_ARGS="$AXE_ARGS --chromedriver-path $CHROMEDRIVER_PATH"
          fi
          if [ -n "${CHROME_PATH:-}" ]; then
            AXE_ARGS="$AXE_ARGS --chrome-path $CHROME_PATH"
          fi
          npx --yes @axe-core/cli http://127.0.0.1:4173/features $AXE_ARGS
          npx --yes @axe-core/cli http://127.0.0.1:4173/ $AXE_ARGS
          npx --yes @axe-core/cli http://127.0.0.1:4173/faq $AXE_ARGS

      # Render builds with the real VITE_* values baked into the entry chunk; this job's
      # build above has none. 3.0.0 passed here at 234.9 KB but failed every Render
      # deploy at 235.1-235.3 KB, so production kept an old backend for 15 merges.
      # Rebuild with placeholder values of production length and re-check the budget.
      - name: Perf budget with production-shaped VITE env (what Render builds)
        env:
          VITE_API_BASE_URL: https://des-call.onrender.com
          VITE_GOOGLE_CLIENT_ID: 000000000000-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.apps.googleusercontent.com
          VITE_WEB_PUSH_PUBLIC_KEY: BAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          VITE_GA_MEASUREMENT_ID: G-AAAAAAAAAA
          VITE_CLARITY_ID: aaaaaaaaaa
          VITE_PUBLIC_POSTHOG_KEY: phc_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          VITE_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          VITE_GOOGLE_ADS_ID: AW-000000000
          VITE_GOOGLE_ADS_SIGNUP_LABEL: aaaaaaaaaaaaaaaaaaaa
          VITE_APP_STORE_URL: https://apps.apple.com/app/descall/id0000000000
        run: npm run build:prod
