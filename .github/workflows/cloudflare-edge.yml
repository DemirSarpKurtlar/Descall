# Scale plan S1 (2.11.5): Cloudflare in front of Render for public, cacheable API reads.
# Manual only. Free-plan features only (DNS record + Cache Rules); nothing here can
# turn on a paid product. The token is read from repo secrets and never printed.
#
# Secrets: CLOUDFLARE_API_TOKEN (zone descall.com: Zone DNS Edit, Zone Cache Rules Edit,
#          Zone Read), CLOUDFLARE_ZONE_ID.
# Order: plan → apply-dns (DNS only, then add api.descall.com as a Render custom domain
#        and wait for "Verified") → apply-proxy → apply-cache → verify.
name: Cloudflare edge

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | apply-dns | apply-proxy | apply-cache | verify"
        required: true
        default: plan
        type: choice
        options: [plan, apply-dns, apply-proxy, apply-cache, verify]

permissions:
  contents: read

concurrency:
  group: cloudflare-edge
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Selftest
        run: node infra/cloudflare/apply-edge.selftest.mjs
      - name: Run ${{ inputs.mode }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node infra/cloudflare/apply-edge.mjs "${{ inputs.mode }}"
