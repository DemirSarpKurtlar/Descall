# Compile the iOS app (unsigned) for pull requests that touch native iOS code
# or the iOS project, so a Swift / package error is caught before a tag starts
# the TestFlight upload. No signing, no secrets, nothing is uploaded.
name: iOS Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/ios/**"
      - "frontend/capacitor.config.*"
      - "frontend/package.json"
      - ".github/workflows/ios-build-check.yml"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Compile iOS app (unsigned)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP"; else echo "::warning::$XCODE_APP not found, using the image default"; fi
          xcodebuild -version

      - name: Native call logic selftest (Swift)
        working-directory: frontend/ios
        run: |
          set -euo pipefail
          swiftc -o "$RUNNER_TEMP/ncl" App/App/DescallNativeCallLogic.swift selftest/main.swift
          "$RUNNER_TEMP/ncl"

      - name: Notification logic selftest (Swift)
        working-directory: frontend/ios
        run: |
          set -euo pipefail
          swiftc -o "$RUNNER_TEMP/nl" App/NotifyShared/DescallNotifyLogic.swift selftest/notify/main.swift
          "$RUNNER_TEMP/nl"
          swiftc -o "$RUNNER_TEMP/tl" App/App/DescallToastLogic.swift App/NotifyShared/DescallNotifyLogic.swift selftest/toast/main.swift
          "$RUNNER_TEMP/tl"

      - name: Watch bridge protocol selftest (Swift)
        working-directory: frontend/ios
        run: |
          set -euo pipefail
          swiftc -o "$RUNNER_TEMP/wp" App/WatchShared/DescallWatchProtocol.swift selftest/watch/main.swift
          "$RUNNER_TEMP/wp"

      - name: Watch copy table selftest (Swift, every UI language)
        working-directory: frontend/ios
        run: |
          set -euo pipefail
          swiftc -o "$RUNNER_TEMP/ws" App/WatchShared/DescallWatchProtocol.swift App/DescallWatch/WatchStrings.swift selftest/watchstrings/main.swift
          "$RUNNER_TEMP/ws"

      - name: watchOS platform (3.7.17 Apple Watch app is embedded)
        run: |
          set -euo pipefail
          if ! xcodebuild -showsdks | grep -q watchos; then xcodebuild -downloadPlatform watchOS; fi
          xcodebuild -showsdks | grep -E "watchos|iphoneos"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets
        working-directory: frontend
        # 3D world is desktop only: no engine bundle or world assets in the iOS app.
        env:
          VITE_WORLD3D: "0"
        run: npm run build:prod

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Resolve Swift packages
        working-directory: frontend/ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build (Release, generic iOS device, unsigned)
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*Descall|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"
          APP="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' | head -n 1)"
          test -d "$APP/Frameworks/WebRTC.framework" && echo "WebRTC.framework embedded"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist"
          # 3.0.0 (A4): both notification extensions are embedded with the right ids.
          for EXT in NotificationService NotificationContent; do
            APPEX="$APP/PlugIns/$EXT.appex"
            test -d "$APPEX" || { echo "::error::$EXT.appex not embedded"; exit 1; }
            ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist")"
            POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist")"
            echo "$EXT: $ID ($POINT)"
            test "$ID" = "com.descall.app.$EXT"
          done
          /usr/libexec/PlistBuddy -c 'Print :NSUserActivityTypes' "$APP/Info.plist" | grep -q INSendMessageIntent
          # 3.7.17: the Apple Watch app is embedded with its own id, the iPhone app as companion.
          WAPP="$APP/Watch/DescallWatch.app"
          test -d "$WAPP" || { echo "::error::DescallWatch.app not embedded"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WAPP/Info.plist")" = "com.descall.app.watchkitapp"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$WAPP/Info.plist")" = "com.descall.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WAPP/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          echo "Watch app embedded: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WAPP/Info.plist")"

  glass-tabbar-sim:
    # iOS 26 Liquid Glass tab bar (DescallGlassTabBarView) on the simulator:
    # Debug build, launched with -DescallGlassTabBarDemo, screenshot uploaded as
    # an artifact. Simulator only: nothing is signed or uploaded to Apple.
    name: Liquid Glass tab bar (iOS 26 simulator screenshot)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP"; fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: watchOS platform (the iOS build embeds the watch app)
        run: |
          set -euo pipefail
          if ! xcodebuild -showsdks | grep -q watchsimulator; then xcodebuild -downloadPlatform watchOS; fi

      - name: Install, build web, sync iOS
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build:prod
          npx cap sync ios

      - name: Pick an iOS 26 iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          c = [(rt, x) for rt, xs in d.items() if "iOS-26" in rt for x in xs if x["name"].startswith("iPhone") and "Pro Max" not in x["name"] and "Plus" not in x["name"]]
          c.sort(key=lambda p: (p[0], p[1]["name"]), reverse=True)
          print(c[0][1]["udid"] if c else "")')"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build (Debug, simulator)
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dds" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/sim-build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/sim-build.log"

      - name: Launch with the native glass tab bar and screenshot
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="$(find "$RUNNER_TEMP/dds/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name 'App.app' | head -n 1)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl install "$UDID" "$APP"
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun simctl launch "$UDID" com.descall.app -DescallGlassTabBarDemo
          sleep 25
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/glass-tabbar-ios26.png"
          xcrun simctl ui "$UDID" appearance light
          sleep 4
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/glass-tabbar-ios26-light.png"
          # 3.0.0 (A4): expanded message notification view (content extension, mockup 28).
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl terminate "$UDID" com.descall.app || true
          xcrun simctl launch "$UDID" com.descall.app -DescallNotifyDemo
          sleep 12
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/notify-expanded-ios26.png"
          # native glass #07: friend-online capsule under the Dynamic Island
          xcrun simctl terminate "$UDID" com.descall.app || true
          xcrun simctl launch "$UDID" com.descall.app -DescallToastDemo
          sleep 12
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/toast-capsule-ios26.png"
          ls -la "$RUNNER_TEMP/shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-tabbar-ios26
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

  watch-sim:
    # 3.7.17 Apple Watch app (design B) on a watchOS simulator with sample data
    # (-DescallWatchDemo): one screenshot per screen, uploaded as an artifact.
    # Simulator only: nothing is signed or uploaded to Apple.
    name: Apple Watch app (watchOS simulator screenshots)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and the watchOS platform
        run: |
          set -euo pipefail
          if [ -d "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP"; fi
          xcodebuild -version
          if ! xcrun simctl list runtimes | grep -q watchOS; then xcodebuild -downloadPlatform watchOS; fi
          xcrun simctl list runtimes | grep watchOS

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, build web, sync iOS (the project resolves the CapApp-SPM package)
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build:prod
          npx cap sync ios

      - name: Pick an Apple Watch simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          c = [(rt, x) for rt, xs in d.items() if "watchOS" in rt for x in xs if "Apple Watch" in x["name"]]
          pref = [p for p in c if "46mm" in p[1]["name"] or "45mm" in p[1]["name"]] or c
          pref.sort(key=lambda p: (p[0], p[1]["name"]), reverse=True)
          print(pref[0][1]["udid"] if pref else "")')"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build the watch app (Debug, simulator)
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme DescallWatch -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/ddw" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/watch-build.log" | grep -E "error:|warning: .*Watch|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/watch-build.log"

      - name: Launch each screen with sample data and screenshot
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="$(find "$RUNNER_TEMP/ddw/Build/Products/Debug-watchsimulator" -maxdepth 1 -name 'DescallWatch.app' | head -n 1)"
          test -d "$APP"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p "$RUNNER_TEMP/watch-shots"
          for SCREEN in chats chat reply friends status admin reports case stepup feedback maintenance; do
            xcrun simctl terminate "$UDID" com.descall.app.watchkitapp || true
            # Turkish, like the App Store listing (primary locale tr).
            xcrun simctl launch "$UDID" com.descall.app.watchkitapp -DescallWatchDemo -DescallWatchDemoScreen "$SCREEN" -AppleLanguages "(tr)" -AppleLocale tr_TR
            sleep 8
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/watch-shots/watch-$SCREEN.png"
          done
          ls -la "$RUNNER_TEMP/watch-shots"
          # Small JPEG copies in the log as base64 (one line each, "WATCHSHOT <name> <data>") so a
          # session that cannot reach artifact storage can still look at the screens.
          for f in "$RUNNER_TEMP"/watch-shots/*.png; do
            n="$(basename "$f" .png)"
            sips -s format jpeg -s formatOptions 72 "$f" --out "$RUNNER_TEMP/$n.jpg" >/dev/null
            echo "WATCHSHOT $n $(base64 -i "$RUNNER_TEMP/$n.jpg" | tr -d '\n')"
          done
          # Full-size PNGs of the five user screens for the App Store listing
          # (appstore/screenshots/watch46, 416x496 = APP_WATCH_SERIES_10).
          for n in chats chat reply friends status; do
            echo "APPSHOT $n $(base64 -i "$RUNNER_TEMP/watch-shots/watch-$n.png" | tr -d '\n')"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-watch-screens
          path: ${{ runner.temp }}/watch-shots
          if-no-files-found: warn
