# Builds the Capacitor iOS app (com.descall.app) on a GitHub macOS runner and uploads it to
# TestFlight. This runner is the only iOS build machine (no local Mac).
#
# Signing: Xcode automatic, cloud-managed signing via the App Store Connect API key (Team key
# "Descall CI", Admin). The team has no registered devices, so automatic *development* signing
# (Xcode's default at archive time) cannot create a profile, and Xcode 26 refuses an Apple
# Distribution identity with automatic signing. So the archive is built unsigned and the export
# step signs it with the cloud-managed Apple Distribution certificate + App Store profile.
# Before export the archived app gets an ad-hoc signature carrying App.release.entitlements,
# because export only keeps entitlements that are present in the archived binary.
# The exported IPA's entitlements are checked before upload; upload uses altool + the API key.
# No certificate or profile is stored in the repo or in secrets.
#
# Secrets: ASC_KEY_P8 (raw .p8 text), ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID.
# The key is written to a 600-permission file outside the workspace and removed at the end.
#
# iOS screen sharing (docs/ios-screen-share.md): the DescallBroadcast ReplayKit extension
# (com.descall.app.broadcast, App Group group.com.descall.app) is always compiled, but it is only
# shipped when the repository variable IOS_BROADCAST_EXTENSION is "1" (or the manual run ticks
# broadcast_extension). Until the owner registered that identifier in the Apple Developer portal
# the appex is removed from the archive before signing, and the app hides Share Screen on iOS.
#
# 4.3 "Paylaş > Descall" share extension (DescallShare, com.descall.app.share; App Group
# group.com.descall.app, shared Keychain group <team>.com.descall.shared): on by default. Its App
# ID is registered with the API key (appstore/asc_register_bundle.py) and it is signed at export
# like the notification extensions. If the registration or the signed export with it fails, the
# appex is taken out and the app ships without it (TestFlight never breaks on it). Turn it off
# with the repository variable IOS_SHARE_EXTENSION=0.
#
# Widgets (draft B "Yuzler", docs in frontend/ios/App/DescallWidgets): the WidgetKit extension
# com.descall.app.widgets (home / lock screen widgets, the call's Live Activity) ships by default.
# The workflow registers its App ID itself (appstore/asc_register_bundle.py, App Group capability)
# and signs it at export like the notification extensions. Repository variable IOS_WIDGETS=0
# turns it off. If the registration or the export signing fails, the extension is removed from the
# archive and the app still ships (a widget problem never breaks TestFlight); the run says so.
#
# Versions: CFBundleShortVersionString = frontend/package.json version (sync-version.cjs keeps the
# iOS MARKETING_VERSION in sync). CFBundleVersion = UTC timestamp YYYYMMDD.HHMM, so every build
# number is higher than the previous one regardless of tag, re-run or manual dispatch.

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      broadcast_extension:
        description: "Ship the iOS screen broadcast extension (needs the Apple portal setup in docs/ios-screen-share.md)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  selftests:
    uses: ./.github/workflows/selftests.yml

  testflight:
    needs: [selftests]
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 75
    env:
      BUNDLE_ID: com.descall.app
      ASC_APP_ID: "6820558264"
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      XCODE_APP: /Applications/Xcode_26.6.app
      SHIP_BROADCAST: ${{ (inputs.broadcast_extension == true || vars.IOS_BROADCAST_EXTENSION == '1') && '1' || '0' }}
      # 4.3 share extension: on unless IOS_SHARE_EXTENSION is "0". Like SHIP_WIDGETS, SHIP_SHARE lives
      # in GITHUB_ENV (set below) so a failed registration or export can turn it off.
      IOS_SHARE_VAR: ${{ vars.IOS_SHARE_EXTENSION }}
      # Widgets draft B: on unless the repository variable IOS_WIDGETS is "0". SHIP_WIDGETS itself
      # lives in GITHUB_ENV (set below) so a failed registration or export can turn it off.
      IOS_WIDGETS_VAR: ${{ vars.IOS_WIDGETS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require App Store Connect secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for ${name}"; missing=1; fi
          done
          [ "$missing" -eq 0 ]
          echo "LOG_DIR=$RUNNER_TEMP/ios-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ios-logs"
          if [ "${IOS_WIDGETS_VAR:-}" = "0" ]; then echo "SHIP_WIDGETS=0" >> "$GITHUB_ENV"; else echo "SHIP_WIDGETS=1" >> "$GITHUB_ENV"; fi
          if [ "${IOS_SHARE_VAR:-}" = "0" ]; then echo "SHIP_SHARE=0" >> "$GITHUB_ENV"; else echo "SHIP_SHARE=1" >> "$GITHUB_ENV"; fi

      - name: Register the broadcast extension App ID (only when it ships)
        if: env.SHIP_BROADCAST == '1'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          REG_BUNDLE_ID: com.descall.app.broadcast
          REG_NAME: Descall Broadcast
          REG_CAPABILITIES: APP_GROUPS
        run: |
          set -euo pipefail
          umask 077
          python3 -m venv "$RUNNER_TEMP/ascreg"
          "$RUNNER_TEMP/ascreg/bin/pip" install --quiet pyjwt cryptography requests
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_reg_key.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          "$RUNNER_TEMP/ascreg/bin/python" appstore/asc_register_bundle.py

      - name: Register the widget extension App ID (skipped, not failed, when Apple refuses)
        if: env.SHIP_WIDGETS == '1'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          REG_BUNDLE_ID: com.descall.app.widgets
          REG_NAME: Descall Widgets
          REG_CAPABILITIES: APP_GROUPS
        run: |
          set -uo pipefail
          umask 077
          ok=1
          python3 -m venv "$RUNNER_TEMP/ascregw" && "$RUNNER_TEMP/ascregw/bin/pip" install --quiet pyjwt cryptography requests || ok=0
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_regw_key.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          if [ "$ok" -eq 1 ]; then "$RUNNER_TEMP/ascregw/bin/python" appstore/asc_register_bundle.py || ok=0; fi
          rm -f "$ASC_KEY_PATH"
          if [ "$ok" -ne 1 ]; then
            echo "::warning::Widget extension App ID could not be registered; this build ships without widgets (the app is unaffected)."
            echo "SHIP_WIDGETS=0" >> "$GITHUB_ENV"
          fi

      - name: Register the share extension App ID (skipped when IOS_SHARE_EXTENSION=0)
        id: share_reg
        if: env.SHIP_SHARE == '1'
        continue-on-error: true
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          REG_BUNDLE_ID: com.descall.app.share
          REG_NAME: Descall Share
          REG_CAPABILITIES: APP_GROUPS
        run: |
          set -euo pipefail
          umask 077
          python3 -m venv "$RUNNER_TEMP/ascshare"
          "$RUNNER_TEMP/ascshare/bin/pip" install --quiet pyjwt cryptography requests
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_share_key.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          trap 'rm -f "$ASC_KEY_PATH"; rm -rf "$RUNNER_TEMP/ascshare"' EXIT
          "$RUNNER_TEMP/ascshare/bin/python" appstore/asc_register_bundle.py

      - name: Share extension decision
        if: env.SHIP_SHARE == '1' && steps.share_reg.outcome != 'success'
        run: |
          echo "SHIP_SHARE=0" >> "$GITHUB_ENV"
          echo "::warning::com.descall.app.share could not be registered; this build ships without the share extension."

      - name: Select Xcode (App Store uploads need Xcode 26+ / iOS 26 SDK)
        run: |
          set -euo pipefail
          if [ -d "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          else
            echo "::warning::$XCODE_APP not found, using the image default"
          fi
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')"
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major is too old for App Store Connect (needs 26+)."
            exit 1
          fi
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: watchOS platform (3.7.17 Apple Watch app is embedded in the iOS app)
        run: |
          set -euo pipefail
          if ! xcodebuild -showsdks | grep -q watchos; then xcodebuild -downloadPlatform watchOS; fi
          xcodebuild -showsdks | grep -E "watchos|iphoneos"

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets (same production build as Render)
        working-directory: frontend
        # 3D world is desktop only: no engine bundle or world assets in the iOS app.
        env:
          VITE_WORLD3D: "0"
        run: npm run build:prod

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Versions
        run: |
          set -euo pipefail
          MARKETING_VERSION="$(node -p "require('./frontend/package.json').version")"
          BUILD_NUMBER="$(date -u +%Y%m%d.%H%M)"
          PBX_VERSION="$(grep -m1 -o 'MARKETING_VERSION = [0-9.]*' frontend/ios/App/App.xcodeproj/project.pbxproj | awk '{print $3}')"
          if [ "$PBX_VERSION" != "$MARKETING_VERSION" ]; then
            echo "::warning::pbxproj MARKETING_VERSION ($PBX_VERSION) differs from package.json ($MARKETING_VERSION); using package.json."
          fi
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Building Descall $MARKETING_VERSION ($BUILD_NUMBER)"

      - name: Install App Store Connect API key (temporary)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"; then
            echo "::error::ASC_KEY_P8 does not look like a .p8 private key."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App 2>&1 | tee "$LOG_DIR/resolve-packages.log"

      - name: Archive (Release, unsigned; signed at export)
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Descall.xcarchive"
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee "$LOG_DIR/archive.log"
          test -d "$ARCHIVE_PATH/Products/Applications/App.app"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Screen broadcast extension (shipped only when IOS_BROADCAST_EXTENSION=1)
        run: |
          set -euo pipefail
          APP="$ARCHIVE_PATH/Products/Applications/App.app"
          BAPPEX="$APP/PlugIns/DescallBroadcast.appex"
          test -d "$BAPPEX" || { echo "::error::DescallBroadcast.appex missing from the archive"; exit 1; }
          if [ "$SHIP_BROADCAST" != "1" ]; then
            rm -rf "$BAPPEX"
            echo "::notice::Screen broadcast extension compiled but not shipped. Do the Apple portal steps in docs/ios-screen-share.md, then set the repository variable IOS_BROADCAST_EXTENSION=1. Without it the app hides Share Screen on iOS."
            exit 0
          fi
          # Shared frameworks live in App.app/Frameworks (the appex runpath has @executable_path/../../Frameworks);
          # an appex with its own Frameworks folder is rejected by App Store Connect.
          if [ -d "$BAPPEX/Frameworks" ]; then
            for fw in "$BAPPEX/Frameworks"/*; do
              [ -e "$fw" ] || continue
              name="$(basename "$fw")"
              if [ -e "$APP/Frameworks/$name" ]; then rm -rf "$fw"; else mkdir -p "$APP/Frameworks" && mv "$fw" "$APP/Frameworks/"; fi
            done
            rmdir "$BAPPEX/Frameworks"
          fi
          echo "Shipping DescallBroadcast.appex ($(du -sh "$BAPPEX" | cut -f1))"

      - name: Widget extension (Live Activity, home and lock screen widgets)
        run: |
          set -euo pipefail
          APP="$ARCHIVE_PATH/Products/Applications/App.app"
          WAPPEX="$APP/PlugIns/DescallWidgets.appex"
          test -d "$WAPPEX" || { echo "::error::DescallWidgets.appex missing from the archive"; exit 1; }
          if [ "$SHIP_WIDGETS" != "1" ]; then
            rm -rf "$WAPPEX"
            echo "::notice::Widget extension compiled but not shipped (IOS_WIDGETS=0 or the App ID registration failed)."
            exit 0
          fi
          if [ -d "$WAPPEX/Frameworks" ]; then
            for fw in "$WAPPEX/Frameworks"/*; do
              [ -e "$fw" ] || continue
              name="$(basename "$fw")"
              if [ -e "$APP/Frameworks/$name" ]; then rm -rf "$fw"; else mkdir -p "$APP/Frameworks" && mv "$fw" "$APP/Frameworks/"; fi
            done
            rmdir "$WAPPEX/Frameworks"
          fi
          echo "Shipping DescallWidgets.appex ($(du -sh "$WAPPEX" | cut -f1))"

      - name: Share extension (shipped unless IOS_SHARE_EXTENSION=0 or registration failed)
        run: |
          set -euo pipefail
          APP="$ARCHIVE_PATH/Products/Applications/App.app"
          SAPPEX="$APP/PlugIns/DescallShare.appex"
          test -d "$SAPPEX" || { echo "::warning::DescallShare.appex missing from the archive"; echo "SHIP_SHARE=0" >> "$GITHUB_ENV"; exit 0; }
          if [ "$SHIP_SHARE" != "1" ]; then
            rm -rf "$SAPPEX"
            echo "::notice::Share extension compiled but not shipped in this build."
            exit 0
          fi
          # Shared frameworks live in App.app/Frameworks; an appex with its own is rejected.
          if [ -d "$SAPPEX/Frameworks" ]; then
            for fw in "$SAPPEX/Frameworks"/*; do
              [ -e "$fw" ] || continue
              name="$(basename "$fw")"
              if [ -e "$APP/Frameworks/$name" ]; then rm -rf "$fw"; else mkdir -p "$APP/Frameworks" && mv "$fw" "$APP/Frameworks/"; fi
            done
            rmdir "$SAPPEX/Frameworks"
          fi
          echo "Shipping DescallShare.appex ($(du -sh "$SAPPEX" | cut -f1))"

      - name: Embed release entitlements in the archive (ad-hoc, re-signed at export)
        run: |
          set -euo pipefail
          # Export keeps only the entitlements found in the archived binary, so an unsigned archive
          # would lose Push (aps-environment) and Sign in with Apple. Ad-hoc sign the archived app
          # with App.release.entitlements; export replaces this with the Apple Distribution signature.
          APP="$ARCHIVE_PATH/Products/Applications/App.app"
          # 4.2: keychain-access-groups use $(AppIdentifierPrefix), a build setting codesign does not
          # expand; give it the team prefix (the shared session group <team>.com.descall.shared).
          ENT="$RUNNER_TEMP/App.release.expanded.entitlements"
          sed 's/\$(AppIdentifierPrefix)/'"$TEAM_ID"'./g' "frontend/ios/App/App/App.release.entitlements" > "$ENT"
          if grep -q 'AppIdentifierPrefix' "$ENT"; then echo "::error::unexpanded AppIdentifierPrefix in the entitlements"; exit 1; fi
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 2>/dev/null |
            while IFS= read -r -d '' fw; do codesign --force --sign - --timestamp=none "$fw"; done
          # 3.0.0 (A4): notification extensions (App Group) are signed first, inside-out.
          for EXT in NotificationService NotificationContent; do
            APPEX="$APP/PlugIns/$EXT.appex"
            test -d "$APPEX" || { echo "::error::$EXT.appex missing from the archive"; exit 1; }
            codesign --force --sign - --timestamp=none \
              --entitlements "frontend/ios/App/$EXT/$EXT.entitlements" --generate-entitlement-der "$APPEX"
            codesign -d --entitlements - --xml "$APPEX" 2>/dev/null | plutil -p -
          done
          # Screen broadcast extension (App Group), when this build ships it.
          BAPPEX="$APP/PlugIns/DescallBroadcast.appex"
          if [ -d "$BAPPEX" ]; then
            codesign --force --sign - --timestamp=none \
              --entitlements "frontend/ios/App/DescallBroadcast/DescallBroadcast.entitlements" --generate-entitlement-der "$BAPPEX"
            codesign -d --entitlements - --xml "$BAPPEX" 2>/dev/null | plutil -p -
          fi
          # 4.3 share extension: App Group + the shared Keychain group (team prefix expanded).
          SAPPEX="$APP/PlugIns/DescallShare.appex"
          if [ -d "$SAPPEX" ]; then
            SENT="$RUNNER_TEMP/DescallShare.expanded.entitlements"
            sed 's/\$(AppIdentifierPrefix)/'"$TEAM_ID"'./g' "frontend/ios/App/DescallShare/DescallShare.entitlements" > "$SENT"
            codesign --force --sign - --timestamp=none --entitlements "$SENT" --generate-entitlement-der "$SAPPEX"
            codesign -d --entitlements - --xml "$SAPPEX" 2>/dev/null | plutil -p -
          fi
          # Widgets draft B: App Group + the shared Keychain session (team prefix expanded).
          WAPPEX="$APP/PlugIns/DescallWidgets.appex"
          if [ -d "$WAPPEX" ]; then
            WENT="$RUNNER_TEMP/DescallWidgets.expanded.entitlements"
            sed 's/\$(AppIdentifierPrefix)/'"$TEAM_ID"'./g' "frontend/ios/App/DescallWidgets/DescallWidgets.entitlements" > "$WENT"
            codesign --force --sign - --timestamp=none --entitlements "$WENT" --generate-entitlement-der "$WAPPEX"
            codesign -d --entitlements - --xml "$WAPPEX" 2>/dev/null | plutil -p -
          fi
          echo "APP_ENT=$ENT" >> "$GITHUB_ENV"
          # 3.7.17: the embedded Apple Watch app (no entitlements of its own), before the outer app.
          WAPP="$APP/Watch/DescallWatch.app"
          test -d "$WAPP" || { echo "::error::DescallWatch.app missing from the archive"; exit 1; }
          codesign --force --sign - --timestamp=none --generate-entitlement-der "$WAPP"
          codesign --force --sign - --timestamp=none --entitlements "$ENT" --generate-entitlement-der "$APP"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p -

      - name: Inspect archive (version)
        run: |
          set -euo pipefail
          APP="$ARCHIVE_PATH/Products/Applications/App.app"
          echo "CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
          echo "CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")"
          echo "ITSAppUsesNonExemptEncryption: $(/usr/libexec/PlistBuddy -c 'Print ITSAppUsesNonExemptEncryption' "$APP/Info.plist")"

      - name: Export signed IPA (cloud-managed distribution signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_PATH="$RUNNER_TEMP/export"
          rm -rf "$EXPORT_PLIST" "$EXPORT_PATH"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_PLIST" >/dev/null
          /usr/libexec/PlistBuddy -c "Add :destination string export" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$EXPORT_PLIST"
          plutil -p "$EXPORT_PLIST"
          export_ipa() {
            rm -rf "$EXPORT_PATH"
            xcodebuild \
              -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT_PATH" \
              -exportOptionsPlist "$EXPORT_PLIST" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              2>&1 | tee "$1"
          }
          APP="$ARCHIVE_PATH/Products/Applications/App.app"
          SAPPEX="$APP/PlugIns/DescallShare.appex"
          WAPPEX="$APP/PlugIns/DescallWidgets.appex"
          export_ok() {
            export_ipa "$1" && [ -n "$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' 2>/dev/null)" ]
          }
          # The share extension and the widgets never break TestFlight: when the signed export
          # fails, drop the extension the log names (else the share extension first), re-sign
          # the app, export again; then the other one if it still fails.
          drop_ext() {
            echo "::warning::Export with $2 failed (signing / provisioning); shipping this build without it, see $3."
            rm -rf "$1"
            codesign --force --sign - --timestamp=none --entitlements "$RUNNER_TEMP/App.release.expanded.entitlements" --generate-entitlement-der "$APP"
            echo "$4=0" >> "$GITHUB_ENV"
          }
          LOG="$LOG_DIR/export.log"
          if ! export_ok "$LOG"; then
            if [ -d "$SAPPEX" ] && { grep -q 'com.descall.app.share' "$LOG" || ! grep -q 'com.descall.app.widgets' "$LOG" || [ ! -d "$WAPPEX" ]; }; then
              drop_ext "$SAPPEX" "the share extension (com.descall.app.share)" "$LOG" SHIP_SHARE
              LOG="$LOG_DIR/export-without-share.log"
            elif [ -d "$WAPPEX" ]; then
              drop_ext "$WAPPEX" "the widget extension (com.descall.app.widgets)" "$LOG" SHIP_WIDGETS
              LOG="$LOG_DIR/export-without-widgets.log"
            else
              exit 1
            fi
            if ! export_ok "$LOG"; then
              if [ -d "$SAPPEX" ]; then
                drop_ext "$SAPPEX" "the share extension (com.descall.app.share)" "$LOG" SHIP_SHARE
              elif [ -d "$WAPPEX" ]; then
                drop_ext "$WAPPEX" "the widget extension (com.descall.app.widgets)" "$LOG" SHIP_WIDGETS
              else
                exit 1
              fi
              export_ok "$LOG_DIR/export-without-extensions.log" || exit 1
            fi
          fi
          IPA="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' | head -n 1)"
          test -s "$IPA"
          ls -lh "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Verify IPA signature and entitlements
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ipa-check"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$IPA_PATH" -d "$WORK"
          APP="$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -n 1)"
          codesign -dvv "$APP" 2>&1 | grep -E '^(Authority|TeamIdentifier|Identifier)=' || true
          codesign -d --entitlements - --xml "$APP" > "$WORK/ent.plist" 2>/dev/null
          plutil -p "$WORK/ent.plist"
          aps="$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$WORK/ent.plist" 2>/dev/null || true)"
          siwa="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' "$WORK/ent.plist" 2>/dev/null || true)"
          gta="$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$WORK/ent.plist" 2>/dev/null || true)"
          ok=1
          [ "$aps" = "production" ] || { echo "::error::aps-environment is '$aps', expected production"; ok=0; }
          [ "$siwa" = "Default" ] || { echo "::error::Sign in with Apple entitlement missing ('$siwa')"; ok=0; }
          [ "$gta" != "true" ] || { echo "::error::get-task-allow is true (development signature)"; ok=0; }
          comm="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.usernotifications.communication' "$WORK/ent.plist" 2>/dev/null || true)"
          group="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$WORK/ent.plist" 2>/dev/null || true)"
          [ "$comm" = "true" ] || { echo "::error::Communication Notifications entitlement missing ('$comm')"; ok=0; }
          [ "$group" = "group.com.descall.app" ] || { echo "::error::App Group missing on the app ('$group')"; ok=0; }
          # 3.0.1: universal links (https://descall.com) need Associated Domains in the signed app.
          ad="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains:0' "$WORK/ent.plist" 2>/dev/null || true)"
          [ "$ad" = "applinks:descall.com" ] || { echo "::error::Associated Domains missing on the app ('$ad')"; ok=0; }
          # 4.2: shared Keychain group for the session the App Intents / extensions read (DescallKit).
          kg="$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups' "$WORK/ent.plist" 2>/dev/null || true)"
          echo "$kg" | grep -q "$TEAM_ID.com.descall.shared" || echo "::warning::keychain-access-groups has no $TEAM_ID.com.descall.shared; Siri and extensions fall back to app-only sessions"
          urlscheme="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Info.plist" 2>/dev/null || true)"
          [ "$urlscheme" = "descall" ] || { echo "::error::descall:// URL scheme missing from Info.plist ('$urlscheme')"; ok=0; }
          for EXT in NotificationService NotificationContent; do
            APPEX="$APP/PlugIns/$EXT.appex"
            [ -d "$APPEX" ] || { echo "::error::$EXT.appex missing from the IPA"; ok=0; continue; }
            codesign -dvv "$APPEX" 2>&1 | grep -E '^(Authority|Identifier)=' || true
            codesign -d --entitlements - --xml "$APPEX" > "$WORK/$EXT.plist" 2>/dev/null || true
            eg="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$WORK/$EXT.plist" 2>/dev/null || true)"
            [ "$eg" = "group.com.descall.app" ] || { echo "::error::$EXT has no App Group ('$eg')"; ok=0; }
            ev="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APPEX/Info.plist")"
            av="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")"
            [ "$ev" = "$av" ] || { echo "::error::$EXT CFBundleVersion $ev != app $av"; ok=0; }
            es="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APPEX/Info.plist")"
            as="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
            [ "$es" = "$as" ] || { echo "::error::$EXT CFBundleShortVersionString $es != app $as"; ok=0; }
            echo "$EXT: $es ($ev) matches app $as ($av)"
          done
          # Screen broadcast extension: present (App Group, id, same version) only when shipped.
          BAPPEX="$APP/PlugIns/DescallBroadcast.appex"
          if [ "$SHIP_BROADCAST" = "1" ]; then
            if [ -d "$BAPPEX" ]; then
              codesign -dvv "$BAPPEX" 2>&1 | grep -E '^(Authority|Identifier)=' || true
              codesign -d --entitlements - --xml "$BAPPEX" > "$WORK/DescallBroadcast.plist" 2>/dev/null || true
              bg="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$WORK/DescallBroadcast.plist" 2>/dev/null || true)"
              [ "$bg" = "group.com.descall.app" ] || { echo "::error::DescallBroadcast has no App Group ('$bg')"; ok=0; }
              bid="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$BAPPEX/Info.plist")"
              [ "$bid" = "com.descall.app.broadcast" ] || { echo "::error::broadcast extension id is $bid"; ok=0; }
              bv="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$BAPPEX/Info.plist")"
              bs="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$BAPPEX/Info.plist")"
              av="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")"
              as="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
              [ "$bv" = "$av" ] && [ "$bs" = "$as" ] || { echo "::error::DescallBroadcast $bs ($bv) != app $as ($av)"; ok=0; }
              [ ! -d "$BAPPEX/Frameworks" ] || { echo "::error::DescallBroadcast.appex has its own Frameworks folder"; ok=0; }
              echo "DescallBroadcast: $bs ($bv) matches app $as ($av)"
            else
              echo "::error::DescallBroadcast.appex missing from the IPA (IOS_BROADCAST_EXTENSION=1)"; ok=0
            fi
          elif [ -d "$BAPPEX" ]; then
            echo "::error::DescallBroadcast.appex shipped although IOS_BROADCAST_EXTENSION is not 1"; ok=0
          fi
          # 4.3 share extension: present with its id, App Group, shared Keychain group, same
          # version, only when this build ships it (SHIP_SHARE can drop to 0 at export).
          SAPPEX="$APP/PlugIns/DescallShare.appex"
          if [ "$SHIP_SHARE" = "1" ]; then
            if [ -d "$SAPPEX" ]; then
              codesign -dvv "$SAPPEX" 2>&1 | grep -E '^(Authority|Identifier)=' || true
              codesign -d --entitlements - --xml "$SAPPEX" > "$WORK/DescallShare.plist" 2>/dev/null || true
              sg="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$WORK/DescallShare.plist" 2>/dev/null || true)"
              [ "$sg" = "group.com.descall.app" ] || { echo "::error::DescallShare has no App Group ('$sg')"; ok=0; }
              skg="$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups' "$WORK/DescallShare.plist" 2>/dev/null || true)"
              echo "$skg" | grep -q "$TEAM_ID.com.descall.shared" || { echo "::error::DescallShare cannot read the shared session ($TEAM_ID.com.descall.shared missing)"; ok=0; }
              sid="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$SAPPEX/Info.plist")"
              [ "$sid" = "com.descall.app.share" ] || { echo "::error::share extension id is $sid"; ok=0; }
              sv="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$SAPPEX/Info.plist")"
              ss="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$SAPPEX/Info.plist")"
              av="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")"
              as="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
              [ "$sv" = "$av" ] && [ "$ss" = "$as" ] || { echo "::error::DescallShare $ss ($sv) != app $as ($av)"; ok=0; }
              [ ! -d "$SAPPEX/Frameworks" ] || { echo "::error::DescallShare.appex has its own Frameworks folder"; ok=0; }
              echo "DescallShare: $ss ($sv) matches app $as ($av)"
            else
              echo "::error::DescallShare.appex missing from the IPA although it ships"; ok=0
            fi
          elif [ -d "$SAPPEX" ]; then
            echo "::error::DescallShare.appex shipped although this build dropped it"; ok=0
          else
            echo "::notice::This build ships without the share extension."
          fi
          # Widgets draft B: present (App Group, shared Keychain group, id, same version) when shipped.
          WAPPEX="$APP/PlugIns/DescallWidgets.appex"
          if [ "$SHIP_WIDGETS" = "1" ]; then
            if [ -d "$WAPPEX" ]; then
              codesign -dvv "$WAPPEX" 2>&1 | grep -E '^(Authority|Identifier)=' || true
              codesign -d --entitlements - --xml "$WAPPEX" > "$WORK/DescallWidgets.plist" 2>/dev/null || true
              wg="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$WORK/DescallWidgets.plist" 2>/dev/null || true)"
              [ "$wg" = "group.com.descall.app" ] || { echo "::error::DescallWidgets has no App Group ('$wg')"; ok=0; }
              wkg="$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups' "$WORK/DescallWidgets.plist" 2>/dev/null || true)"
              echo "$wkg" | grep -q "$TEAM_ID.com.descall.shared" || echo "::warning::DescallWidgets has no shared Keychain group; widgets will show 'Sign in'"
              wid="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$WAPPEX/Info.plist")"
              [ "$wid" = "com.descall.app.widgets" ] || { echo "::error::widget extension id is $wid"; ok=0; }
              wv="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$WAPPEX/Info.plist")"
              wsv="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$WAPPEX/Info.plist")"
              av="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")"
              as="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
              [ "$wv" = "$av" ] && [ "$wsv" = "$as" ] || { echo "::error::DescallWidgets $wsv ($wv) != app $as ($av)"; ok=0; }
              [ ! -d "$WAPPEX/Frameworks" ] || { echo "::error::DescallWidgets.appex has its own Frameworks folder"; ok=0; }
              la="$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist" 2>/dev/null || true)"
              [ "$la" = "true" ] || { echo "::error::NSSupportsLiveActivities missing from the app Info.plist"; ok=0; }
              echo "DescallWidgets: $wsv ($wv) matches app $as ($av)"
            else
              echo "::error::DescallWidgets.appex missing from the IPA although it was meant to ship"; ok=0
            fi
          else
            [ ! -d "$WAPPEX" ] || { echo "::error::DescallWidgets.appex shipped although widgets were turned off for this build"; ok=0; }
            echo "::notice::This build ships without the widget extension."
          fi
          # 3.7.17: Apple Watch app signed for distribution, same version and build as the app.
          WAPP="$APP/Watch/DescallWatch.app"
          if [ -d "$WAPP" ]; then
            codesign -dvv "$WAPP" 2>&1 | grep -E '^(Authority|Identifier)=' || true
            wid="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$WAPP/Info.plist")"
            [ "$wid" = "com.descall.app.watchkitapp" ] || { echo "::error::watch app id is $wid"; ok=0; }
            wv="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$WAPP/Info.plist")"
            ws="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$WAPP/Info.plist")"
            av="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")"
            as="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
            [ "$wv" = "$av" ] && [ "$ws" = "$as" ] || { echo "::error::watch app $ws ($wv) != app $as ($av)"; ok=0; }
            echo "DescallWatch: $ws ($wv) matches app $as ($av)"
          else
            echo "::error::DescallWatch.app missing from the IPA"; ok=0
          fi
          [ "$ok" -eq 1 ]
          echo "Entitlements OK for App Store distribution."

      - name: Upload to App Store Connect (altool + API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # altool finds the key in ~/.appstoreconnect/private_keys/AuthKey_<id>.p8
          # --upload-package with the app's numeric Apple ID: Xcode 26's `--upload-app`
          # looks the app up from the bundle ID and failed with "Cannot determine the
          # Apple ID from Bundle ID" on 2026-11-13 (3.7.44), while the same key signed
          # the export fine. Passing the IDs skips that lookup.
          xcrun altool --upload-package "$IPA_PATH" --type ios \
            --apple-id "$ASC_APP_ID" --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUILD_NUMBER" --bundle-short-version-string "$MARKETING_VERSION" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --show-progress --output-format normal 2>&1 | tee "$LOG_DIR/upload.log"
          grep -Ei "UPLOAD SUCCEEDED|Delivery UUID" "$LOG_DIR/upload.log"

      - name: Confirm the build reached App Store Connect
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/ascvenv/bin/python" - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          import jwt
          key = open(os.environ["ASC_KEY_PATH"]).read()
          def token():
              now = int(time.time())
              return jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                                key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          q = urllib.parse.urlencode({"filter[app]": os.environ["ASC_APP_ID"], "filter[version]": os.environ["BUILD_NUMBER"],
                                      "fields[builds]": "version,processingState,uploadedDate,usesNonExemptEncryption"})
          url = f"https://api.appstoreconnect.apple.com/v1/builds?{q}"
          for attempt in range(30):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token()}"})
              data = json.load(urllib.request.urlopen(req, timeout=30)).get("data", [])
              if data:
                  a = data[0]["attributes"]
                  print(f"App Store Connect build {a.get('version')}: processingState={a.get('processingState')} uploaded={a.get('uploadedDate')} usesNonExemptEncryption={a.get('usesNonExemptEncryption')}")
                  if a.get("processingState") in ("VALID", "INVALID", "FAILED"):
                      break
              else:
                  print(f"[{attempt}] build {os.environ['BUILD_NUMBER']} not visible in App Store Connect yet")
              time.sleep(30)
          PY

      - name: Assign build to internal group Descall Ekip
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MODE: assign-internal
          GROUP_NAME: Descall Ekip
        run: |
          set -euo pipefail
          # Internal TestFlight only. Does not submit for beta review or App Store review.
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install --quiet pyjwt cryptography requests
          "$RUNNER_TEMP/ascvenv/bin/python" appstore/asc_beta_tester.py

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p "$LOG_DIR"
          # Xcode distribution logs (export/upload details); never includes the API key file.
          find "${TMPDIR:-/tmp}" -maxdepth 3 -name '*.xcdistributionlogs' -print -exec cp -R {} "$LOG_DIR/" \; 2>/dev/null || true
          if [ -n "${ARCHIVE_PATH:-}" ] && [ -d "$ARCHIVE_PATH" ]; then
            ditto -c -k --keepParent "$ARCHIVE_PATH" "$LOG_DIR/Descall.xcarchive.zip" || true
          fi
          find "$RUNNER_TEMP/export" -name '*.ipa' -exec cp {} "$LOG_DIR/" \; 2>/dev/null || true
          ls -la "$LOG_DIR" || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-testflight-debug-${{ github.run_number }}
          path: ${{ runner.temp }}/ios-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove App Store Connect API key
        if: always()
        run: |
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/ascvenv"
          echo "API key removed."
