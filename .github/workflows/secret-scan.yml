name: Secret scan

# Full git history. Findings are redacted in the log. Public client identifiers
# are allowlisted in .gitleaks.toml; server-secret names are rejected below.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # GitHub release downloads sometimes answer 504 for minutes; then take the same
          # version from the project's official image on ghcr.io instead.
          if curl -sSfL --retry 3 --retry-delay 10 --retry-all-errors -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz"; then
            tar -xzf /tmp/gitleaks.tgz -C /tmp
            sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          else
            echo "release download failed; using ghcr.io/gitleaks/gitleaks:v8.28.0"
            docker pull ghcr.io/gitleaks/gitleaks:v8.28.0
            cid=$(docker create ghcr.io/gitleaks/gitleaks:v8.28.0)
            sudo docker cp "$cid:/usr/bin/gitleaks" /usr/local/bin/gitleaks
            docker rm "$cid"
          fi
          gitleaks version

      - name: Scan history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Reject server secret names in client files
        run: |
          if git grep -n -E 'SUPABASE_SERVICE_ROLE(_KEY)?[[:space:]]*[:=][[:space:]]*['"'"'\"A-Za-z0-9_\-]{12,}|JWT_SECRET[[:space:]]*=[[:space:]]*[^[:space:]#]{8,}|RESEND_API_KEY[[:space:]]*=[[:space:]]*\S|TURN_CREDENTIAL[[:space:]]*=[[:space:]]*[^[:space:]#]{8,}|RIOT_CLIENT_SECRET[[:space:]]*=[[:space:]]*[^[:space:]#]{8,}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|sk_live_' -- frontend/src frontend/public frontend/index.html frontend/.env.production; then
            echo "::error::Server secret name found in client files"
            exit 1
          fi
          echo "client files have no server secret names"
