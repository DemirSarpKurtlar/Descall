name: Secret scan

# Full git history. Findings are redacted in the log. Public client identifiers
# are allowlisted in .gitleaks.toml; server-secret names are rejected below.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Reject server secret names in client files
        run: |
          if git grep -n -E 'SUPABASE_SERVICE_ROLE(_KEY)?[[:space:]]*[:=][[:space:]]*['"'"'\"A-Za-z0-9_\-]{12,}|JWT_SECRET[[:space:]]*=[[:space:]]*[^[:space:]#]{8,}|RESEND_API_KEY[[:space:]]*=[[:space:]]*\S|TURN_CREDENTIAL[[:space:]]*=[[:space:]]*[^[:space:]#]{8,}|RIOT_CLIENT_SECRET[[:space:]]*=[[:space:]]*[^[:space:]#]{8,}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|sk_live_' -- frontend/src frontend/public frontend/index.html frontend/.env.production; then
            echo "::error::Server secret name found in client files"
            exit 1
          fi
          echo "client files have no server secret names"
