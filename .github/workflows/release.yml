name: Publish Descall release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Same web build Render runs (marketing locale check + vite + SEO checks).
  # On Windows the locale check didn't catch the 2.9.118 gap, so gate every
  # desktop/iOS release on a Linux web build: no client ships before the server can.
  web-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Web build (same checks as Render)
        working-directory: frontend
        run: |
          npm ci
          npm run build:prod
      - name: Backend syntax check
        working-directory: frontend/backend
        run: |
          find . -path ./node_modules -prune -o -name "*.js" -print | xargs -n 50 node --check

  selftests:
    uses: ./.github/workflows/selftests.yml

  windows:
    needs: [web-gate, selftests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build Windows setup
        working-directory: frontend
        shell: pwsh
        env:
          ELECTRON_BUILD: "1"
          # NSIS extracts app-64.7z with nsis7z. 7-Zip's default BCJ2 filter is
          # not reliably decoded there, which drops or corrupts Descall.exe and
          # ffmpeg.dll (0xc000007b). BCJ is the filter that extractor can read.
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          # Optional Authenticode cert (PFX, base64 or path). Empty secrets must
          # not be forwarded: electron-builder treats a blank CSC_LINK as a
          # signing failure. The certificate subject (CN) must be Descall so it
          # matches the CompanyName written into the exe. SmartScreen's
          # "Unknown publisher" line is the signature, not the version resource.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Windows checks out with LF too (.gitattributes); fail if it did not, because
          # inline <script> CSP hashes depend on it (2.11.11).
          $crlf = (git ls-files --eol index.html) -match 'w/crlf'
          if ($crlf) { throw "frontend/index.html was checked out with CRLF (check .gitattributes)" }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with $LASTEXITCODE" }
          # A failing build step (csp-verify-dist, perf budget, SEO) must stop the release.
          npm run build:prod
          if ($LASTEXITCODE -ne 0) { throw "build:prod failed with $LASTEXITCODE" }
          if (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            $env:CSC_LINK = $env:WIN_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD
            Write-Host "Code signing certificate present. Signing the setup."
          } else {
            # electron-builder reads WIN_CSC_LINK itself. An empty GitHub secret
            # is still set, and a blank value resolves to the working directory
            # and fails the build ("not a file").
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            Write-Host "No WIN_CSC_LINK secret. Building unsigned. File properties still name Descall; SmartScreen stays Unknown publisher until a trusted cert is configured."
          }
          npx --yes @electron/rebuild@3.7.2 -f -a x64
          if ($LASTEXITCODE -ne 0) { throw "electron-rebuild failed with $LASTEXITCODE" }
          npx electron-builder --win --publish=never
      - name: Copy stable latest setup name
        shell: pwsh
        working-directory: frontend/release
        run: |
          $exe = Get-ChildItem -File -Filter "Descall-Setup-*.exe" |
            Where-Object { $_.Name -ne "Descall-Setup.exe" } |
            Select-Object -First 1
          if (-not $exe) { throw "No Descall-Setup-*.exe was produced" }
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $exe.DirectoryName "Descall-Setup.exe") -Force
          Write-Host "Copied $($exe.Name) -> Descall-Setup.exe"
      - name: Smoke test packaged exe and an in-place update
        shell: pwsh
        working-directory: frontend
        run: |
          $ErrorActionPreference = "Stop"
          node electron/peArch.cjs --dir release/win-unpacked --expect 34404 --require Descall.exe,ffmpeg.dll
          function Invoke-Smoke([string]$Exe) {
            $env:DESCALL_SMOKE = "1"
            $proc = Start-Process -FilePath $Exe -ArgumentList "--descall-smoke" -PassThru
            if (-not $proc.WaitForExit(45000)) {
              try { Stop-Process -Id $proc.Id -Force } catch {}
              throw "Descall.exe did not exit within 45s ($Exe). A 0xc000007b crash never reaches the smoke flag."
            }
            if ($proc.ExitCode -ne 0) { throw "Descall.exe smoke exit code $($proc.ExitCode) ($Exe)" }
            Write-Host "smoke ok $Exe"
          }
          # Real boot of the packaged app (electron/bootSmoke.cjs): the main window must paint,
          # the boot splash must be gone and no inline script may be blocked by the CSP.
          function Invoke-BootSmoke([string]$Exe) {
            $ud = Join-Path $env:TEMP ("descall-bootsmoke-" + [guid]::NewGuid().ToString("n"))
            $out = Join-Path $env:TEMP ("descall-bootsmoke-" + [guid]::NewGuid().ToString("n") + ".log")
            $prevSmoke = $env:DESCALL_SMOKE
            $env:DESCALL_SMOKE = "boot"
            $proc = Start-Process -FilePath $Exe -ArgumentList "--descall-smoke-boot", "--user-data-dir=$ud" -RedirectStandardError $out -PassThru
            $finished = $proc.WaitForExit(90000)
            $env:DESCALL_SMOKE = $prevSmoke
            if (-not $finished) {
              try { Stop-Process -Id $proc.Id -Force } catch {}
              throw "boot smoke did not finish within 90s ($Exe)"
            }
            if (Test-Path $out) { Get-Content $out | Select-String "smoke-boot" | ForEach-Object { Write-Host $_ } }
            $json = Join-Path $ud "smoke-boot.json"
            if (-not (Test-Path $json)) { throw "boot smoke wrote no result, so the main window never booted ($Exe)" }
            $result = Get-Content $json -Raw | ConvertFrom-Json
            Write-Host "boot smoke result: $($result.reason) in $($result.elapsedMs)ms (v$($result.version))"
            if ($proc.ExitCode -ne 0 -or -not $result.ok) { throw "boot smoke failed: $($result.reason) ($Exe)" }
            Write-Host "boot smoke ok $Exe"
          }
          Invoke-Smoke (Join-Path (Get-Location) "release\win-unpacked\Descall.exe")
          Invoke-BootSmoke (Join-Path (Get-Location) "release\win-unpacked\Descall.exe")
          # No Descall process may outlive the smoke runs: the silent installer below refuses to
          # write over a running app.
          Get-Process Descall -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $setup = Get-ChildItem -File release\Descall-Setup-*.exe |
            Where-Object { $_.Name -ne "Descall-Setup.exe" } |
            Select-Object -First 1
          if (-not $setup) { throw "No versioned setup exe" }
          $dest = Join-Path $env:TEMP ("descall-smoke-" + [guid]::NewGuid().ToString("n"))
          New-Item -ItemType Directory -Path $dest | Out-Null
          # The NSIS setup can hand off to a child process and return before the files are
          # written (flaky "did not write Descall.exe" in 2.11.10 / 2.11.12): wait for it.
          function Wait-Installer([string]$Path) {
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              $busy = Get-Process | Where-Object { $_.ProcessName -like "Descall-Setup*" -or $_.ProcessName -like "Un_A*" -or $_.ProcessName -like "Au_*" }
              if (-not $busy -and (Test-Path $Path)) { return }
              Start-Sleep -Milliseconds 500
            }
          }
          cmd /c "`"$($setup.FullName)`" /S /D=$dest"
          Wait-Installer (Join-Path $dest "Descall.exe")
          if (-not (Test-Path (Join-Path $dest "Descall.exe"))) { throw "Silent install did not write Descall.exe" }
          if (-not (Test-Path (Join-Path $dest "ffmpeg.dll"))) { throw "Silent install did not write ffmpeg.dll" }
          Invoke-Smoke (Join-Path $dest "Descall.exe")
          Invoke-BootSmoke (Join-Path $dest "Descall.exe")
          Get-Process Descall -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $ffmpeg = Join-Path $dest "ffmpeg.dll"
          $before = (Get-FileHash -Algorithm SHA256 $ffmpeg).Hash
          [IO.File]::WriteAllBytes($ffmpeg, [byte[]](0x4D, 0x5A, 0x00, 0x00))
          cmd /c "`"$($setup.FullName)`" /S --updated /D=$dest"
          if (-not $?) { throw "in-place update installer failed" }
          Wait-Installer (Join-Path $dest "Descall.exe")
          $after = (Get-FileHash -Algorithm SHA256 $ffmpeg).Hash
          if ($after -ne $before) { throw "update left a damaged ffmpeg.dll in place" }
          Invoke-Smoke (Join-Path $dest "Descall.exe")
          Get-Process Descall -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "windows smoke and update-from-previous ok"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          # latest.yml + the .exe.blockmap are required by electron-updater's
          # generic/github feed to detect and verify new versions — without
          # them the desktop app silently never sees an update again.
          path: |
            frontend/release/*.exe
            frontend/release/*.blockmap
            frontend/release/latest.yml

  publish:
    needs: [windows]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes shells out to git for the repo
      # context (compare link, commit range); without a checkout it fails
      # with "not a git repository".
      - uses: actions/checkout@v4
      - name: Download Windows setup
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets/windows-setup
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/windows-setup/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Windows setup artifacts" >&2
            exit 1
          fi
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --generate-notes
          fi
