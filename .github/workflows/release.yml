name: Publish Descall release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Capacitor CLI 8.x requires Node >=22 (`npx cap sync` fails otherwise).
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Sync Android version from tag
        working-directory: frontend/android/app
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "Setting versionName=$TAG versionCode=$CODE"
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$TAG\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle
      - name: Build signed APK
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build:prod
          npx cap sync android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/descall-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=app/descall-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          cd android && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Descall-APK-${GITHUB_REF_NAME}.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: frontend/Descall-APK-*.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build Windows setup
        working-directory: frontend
        shell: pwsh
        env:
          ELECTRON_BUILD: "1"
          # Optional Authenticode cert (PFX, base64 or path). Empty secrets must
          # not be forwarded: electron-builder treats a blank CSC_LINK as a
          # signing failure. The certificate subject (CN) must be Descall so it
          # matches the CompanyName written into the exe. SmartScreen's
          # "Unknown publisher" line is the signature, not the version resource.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build:prod
          if ($env:WIN_CSC_LINK) {
            $env:CSC_LINK = $env:WIN_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD
            Write-Host "Code signing certificate present. Signing the setup."
          } else {
            Write-Host "No WIN_CSC_LINK secret. Building unsigned. File properties still name Descall; SmartScreen stays Unknown publisher until a trusted cert is configured."
          }
          npx electron-builder --win --publish=never
      - name: Copy stable latest setup name
        shell: pwsh
        working-directory: frontend/release
        run: |
          $exe = Get-ChildItem -File -Filter "Descall-Setup-*.exe" |
            Where-Object { $_.Name -ne "Descall-Setup.exe" } |
            Select-Object -First 1
          if (-not $exe) { throw "No Descall-Setup-*.exe was produced" }
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $exe.DirectoryName "Descall-Setup.exe") -Force
          Write-Host "Copied $($exe.Name) -> Descall-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          # latest.yml + the .exe.blockmap are required by electron-updater's
          # generic/github feed to detect and verify new versions — without
          # them the desktop app silently never sees an update again.
          path: |
            frontend/release/*.exe
            frontend/release/*.blockmap
            frontend/release/latest.yml

  publish:
    needs: [android, windows]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes shells out to git for the repo
      # context (compare link, commit range); without a checkout it fails
      # with "not a git repository".
      - uses: actions/checkout@v4
      - name: Download Windows setup
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets/windows-setup
      - name: Download Android APK
        if: needs.android.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/android-apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/windows-setup/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Windows setup artifacts" >&2
            exit 1
          fi
          if [ -d release-assets/android-apk ]; then
            assets+=(release-assets/android-apk/*)
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --generate-notes
