# Dependabot: keeps dependencies up to date with as little noise as possible.
#
# What it does (plain words): once a week (Monday 07:00 Istanbul time) Dependabot checks
# every package list below and opens AT MOST one pull request per ecosystem with all the
# small (minor + patch) updates bundled together. Security fixes come in their own separate
# pull request as soon as GitHub publishes an advisory (not only on Mondays). Big (major)
# upgrades of the packages that can break the apps are ignored here: those are done by hand.
# Every pull request runs the normal CI (selftests, iOS / Android / Windows builds), so a
# red check means "do not merge yet"; nothing is ever merged automatically.
#
# Rules kept on purpose:
#  - Every `directory` below must exist and hold a manifest (selftest:
#    frontend/scripts/ciConfig.selftest.mjs checks this on every PR).
#  - Ignoring a package also hides it from security pull requests for that ecosystem; the
#    alert still shows under Security > Dependabot alerts.
#  - Swift (frontend/ios/App/CapApp-SPM/Package.swift) is NOT listed: that file is
#    generated by the Capacitor CLI ("DO NOT MODIFY"), pins capacitor-swift-pm to the
#    @capacitor/ios npm version and points at ../../../node_modules, which does not exist in
#    Dependabot's checkout, so it cannot resolve. It is upgraded with Capacitor (npm) itself.
version: 2

updates:
  # ── Product JavaScript: web/iOS/Android app, backend (Render), Electron shell ──────────
  - package-ecosystem: npm
    directories:
      - "/frontend"
      - "/frontend/backend"
      - "/frontend/electron"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope
    labels: ["dependencies", "javascript"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      # Majors of the core runtime are planned by hand (they need device testing).
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron-updater"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "socket.io*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babylonjs/*"
        update-types: ["version-update:semver-major"]

  # ── Internal tools (video, marketing, 3D world, edge worker): security fixes only ──────
  # open-pull-requests-limit 0 turns weekly version updates off; security updates still
  # arrive (grouped) when the repository's Dependabot security updates setting is on.
  - package-ecosystem: npm
    directories:
      - "/descall-video"
      - "/marketing/instagram"
      - "/tools/world3d"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(tools)"
    labels: ["dependencies", "javascript"]
    groups:
      tools-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── Rust: Windows desktop app (Tauri) and its crates ──────────────────────────────────
  - package-ecosystem: cargo
    directory: "/desktop"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(desktop)"
    labels: ["dependencies", "rust"]
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
      cargo-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-major"]
      # 0.x crates: a "minor" bump is a breaking change for them (WebView2 / Win32 bindings).
      - dependency-name: "wry"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "windows*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "webview2-com*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # ── GitHub Actions used by the workflows in .github/workflows ─────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github_actions"]
    groups:
      actions-all:
        patterns: ["*"]

  # ── Android (Gradle): Android Gradle Plugin, Google services, AndroidX ────────────────
  # Monthly and quiet: Capacitor owns most of these versions (variables.gradle) and moves
  # them when @capacitor/android is upgraded.
  - package-ecosystem: gradle
    directory: "/frontend/android"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(android)"
    labels: ["dependencies", "java"]
    groups:
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]
      gradle-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
